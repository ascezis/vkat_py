name: Release and Package

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Auto Version & Package Standalone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run JS Validation
        run: node dev/run_js_validation.js

      - name: Run Python Evaluation Tests
        run: python dev/run_tests.py

      - name: Resolve Release Tag
        id: resolve_tag
        run: |
          TAG=""
          CHANGELOG=""

          # 1. Если триггер был по push тега:
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            CHANGELOG="Релиз $TAG"
          else
            # 2. Читаем версию из app/version.js (единый источник истины проекта):
            APP_VER=$(node -e "const vm = require('vm'); const ctx = { window: {} }; vm.createContext(ctx); vm.runInContext(require('fs').readFileSync('app/version.js', 'utf8'), ctx); console.log(ctx.window.VKAT_VERSION || '');")
            if [ -n "$APP_VER" ]; then
              CANDIDATE_TAG="v$APP_VER"
              # Проверяем, существует ли уже опубликованный GitHub Release:
              RELEASE_EXISTS=$(gh release view "$CANDIDATE_TAG" --json tagName -q .tagName 2>/dev/null || true)
              if [ -z "$RELEASE_EXISTS" ]; then
                TAG="$CANDIDATE_TAG"
                PREV_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
                if [ -n "$PREV_TAG" ]; then
                  CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"* %s (%h)" || true)
                fi
                if [ -z "$CHANGELOG" ]; then
                  CHANGELOG="Релиз $TAG"
                fi
              fi
            fi
          fi

          if [ -n "$TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Resolved release tag: $TAG"
            DELIMITER="EOF_CHANGELOG_$(date +%s)"
            {
              echo "changelog<<${DELIMITER}"
              echo "$CHANGELOG"
              echo "${DELIMITER}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No new release tag required for this build."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Standalone Offline ZIP
        if: steps.resolve_tag.outputs.tag != ''
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          ZIP_NAME="vkat_py-${TAG}-standalone.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "dev/*" \
            -x "AI-PROMPTS/*" \
            -x "ai-prompts/*" \
            -x "CLAUDE/*" \
            -x "claude/*" \
            -x "CLAUDE-DESIGN/*" \
            -x "claude-design/*" \
            -x "patches/*" \
            -x "*.patch" \
            -x ".gitignore" \
            -x "*.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: steps.resolve_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: Релиз ${{ steps.resolve_tag.outputs.tag }}
          body: ${{ steps.resolve_tag.outputs.changelog }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
