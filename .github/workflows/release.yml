name: Release and Package

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Auto Version & Package Standalone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run JS Validation
        run: node dev/run_js_validation.js

      - name: Run Python Evaluation Tests
        run: python dev/run_tests.py

      - name: Determine Next Semantic Version & Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          tag_prefix: v
          initial_version: 2.1.0

      - name: Build Standalone Offline ZIP
        if: steps.tag_version.outputs.new_tag != ''
        run: |
          TAG="${{ steps.tag_version.outputs.new_tag }}"
          ZIP_NAME="vkat_py-${TAG}-standalone.zip"
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "dev/*" \
            -x "AI-promts/*" \
            -x "*.patch" \
            -x ".gitignore" \
            -x "*.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: steps.tag_version.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Релиз ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
