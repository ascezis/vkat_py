name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run JS Validation
        run: node dev/run_js_validation.js

      - name: Run Python Evaluation Tests
        run: python dev/run_tests.py

      - name: Run Alife-System Tests
        run: python dev/test_alife_system.py

      - name: Type Check (checkJs, zero errors required)
        run: npx -y -p typescript@5.5.4 tsc -p jsconfig.json --noEmit --pretty false
